<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Finanças · Lucas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── THEMES ── */
:root {
  --bg:#06080f; --surface:#0e111a; --surface2:#161b28; --surface3:#1e2438;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.13);
  --text:#dde1f0; --muted:#434d62; --muted2:#7a8599;
  --accent:#3d6fff; --green:#00e5a0; --red:#ff4f6d;
  --yellow:#ffb700; --purple:#a855f7; --orange:#ff7b2e;
  --neon-green:0 0 8px #00e5a0,0 0 22px rgba(0,229,160,.3);
  --neon-red:0 0 8px #ff4f6d,0 0 22px rgba(255,79,109,.3);
  --neon-blue:0 0 8px #3d6fff,0 0 22px rgba(61,111,255,.3);
  --neon-yellow:0 0 8px #ffb700,0 0 20px rgba(255,183,0,.3);
  --heading-font:'Orbitron',monospace;
  --body-font:'DM Sans',sans-serif;
  --mono-font:'Space Mono',monospace;
  --theme-name:'DARK';
  --header-bg:rgba(6,8,15,0.97);
  --header-border:rgba(61,111,255,.2);
  --pill-active-bg:rgba(61,111,255,.15);
  --pill-active-border:var(--accent);
  --pill-active-color:var(--accent);
}

[data-theme="clean"] {
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f0f1f4; --surface3:#e8eaef;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.15);
  --text:#1a1d2e; --muted:#9ba3b4; --muted2:#6b7280;
  --accent:#2563eb; --green:#059669; --red:#dc2626;
  --yellow:#d97706; --purple:#7c3aed; --orange:#ea580c;
  --neon-green:none; --neon-red:none; --neon-blue:none; --neon-yellow:none;
  --heading-font:'Inter',sans-serif;
  --body-font:'Inter',sans-serif;
  --mono-font:'Inter',monospace;
  --theme-name:'CLEAN';
  --header-bg:rgba(255,255,255,0.97);
  --header-border:rgba(0,0,0,0.1);
  --pill-active-bg:#2563eb;
  --pill-active-border:#2563eb;
  --pill-active-color:#ffffff;
}

[data-theme="zioto"] {
  --bg:#0a0a0c; --surface:#111115; --surface2:#18181e; --surface3:#1f1f28;
  --border:rgba(155,29,219,0.15); --border2:rgba(155,29,219,0.3);
  --text:#e8e8f0; --muted:#52525e; --muted2:#9898a8;
  --accent:#9B1DDB; --green:#00e5a0; --red:#ff4f6d;
  --yellow:#F5E642; --purple:#9B1DDB; --orange:#ff7b2e;
  --neon-green:0 0 8px #00e5a0,0 0 22px rgba(0,229,160,.25);
  --neon-red:0 0 8px #ff4f6d,0 0 22px rgba(255,79,109,.25);
  --neon-blue:0 0 10px #9B1DDB,0 0 28px rgba(155,29,219,.4);
  --neon-yellow:0 0 10px #F5E642,0 0 28px rgba(245,230,66,.4);
  --heading-font:'Rajdhani',sans-serif;
  --body-font:'Inter',sans-serif;
  --mono-font:'Space Mono',monospace;
  --theme-name:'ZIOTO';
  --header-bg:rgba(10,10,12,0.98);
  --header-border:rgba(155,29,219,.3);
  --pill-active-bg:rgba(155,29,219,.2);
  --pill-active-border:#9B1DDB;
  --pill-active-color:#F5E642;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--text); font-family:var(--body-font); min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; transition:background .3s,color .3s; }

/* scanlines only for dark themes */
:root body::before,[data-theme="zioto"] body::before {
  content:''; position:fixed; inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.025) 2px,rgba(0,0,0,.025) 4px);
  pointer-events:none; z-index:999;
}
[data-theme="clean"] body::before { display:none; }

/* ── LOGIN SCREEN ── */
.login-wrap {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--bg); padding:24px;
}
.login-card {
  background:var(--surface); border:1px solid var(--border2);
  border-radius:20px; padding:40px 32px; width:100%; max-width:360px;
  text-align:center;
}
.login-logo {
  font-family:var(--heading-font); font-size:16px; color:var(--accent);
  letter-spacing:.18em; text-shadow:var(--neon-blue); margin-bottom:8px;
}
.login-sub { font-size:12px; color:var(--muted); margin-bottom:32px; }
.login-input {
  width:100%; background:var(--surface2); border:1px solid var(--border2);
  border-radius:10px; color:var(--text); font-family:var(--mono-font);
  font-size:14px; padding:12px 16px; outline:none; margin-bottom:12px;
  letter-spacing:.1em; transition:border-color .2s;
}
.login-input:focus { border-color:var(--accent); }
.login-btn {
  width:100%; background:var(--accent); border:none; border-radius:10px;
  color:#fff; font-family:var(--heading-font); font-size:13px;
  font-weight:700; letter-spacing:.12em; padding:13px;
  cursor:pointer; transition:opacity .2s;
}
.login-btn:hover { opacity:.88; }
.login-err {
  font-size:11px; color:var(--red); margin-top:10px;
  font-family:var(--mono-font); display:none;
}

/* ── HEADER ── */
.hdr {
  position:sticky; top:0; z-index:300;
  background:var(--header-bg); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--header-border);
  padding:11px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  transition:background .3s,border-color .3s;
}
.logo { font-family:var(--heading-font); font-size:11px; color:var(--accent); letter-spacing:.16em; text-shadow:var(--neon-blue); white-space:nowrap; }
[data-theme="zioto"] .logo { font-size:10px; }
.hdr-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.year-sel { background:var(--surface2); border:1px solid var(--border2); border-radius:8px; color:var(--text); font-family:var(--mono-font); font-size:10px; padding:5px 8px; cursor:pointer; outline:none; }
.hdr-btn { display:flex; align-items:center; gap:4px; background:none; border:1px solid var(--border2); border-radius:8px; color:var(--muted2); font-size:10px; font-family:var(--mono-font); padding:5px 9px; cursor:pointer; transition:all .2s; white-space:nowrap; }
.hdr-btn:hover { border-color:var(--accent); color:var(--accent); }
.sync-btn.loading { color:var(--yellow); border-color:var(--yellow); pointer-events:none; }
.sync-btn.ok { color:var(--green); border-color:var(--green); }
.sync-btn.err { color:var(--red); border-color:var(--red); }
@keyframes spin { to { transform:rotate(360deg); } }
.spin { display:inline-block; animation:spin .7s linear infinite; }

/* ── MONTH STRIP ── */
.mwrap { padding:11px 16px; border-bottom:1px solid var(--border); background:var(--surface); transition:background .3s; }
.mrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.mrow-label { font-family:var(--mono-font); font-size:9px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; }
.m-pills { display:flex; flex-wrap:wrap; gap:5px; flex:1; }
.mpill { padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted2); font-family:var(--mono-font); font-size:10px; letter-spacing:.04em; cursor:pointer; transition:all .15s; user-select:none; }
.mpill:hover { border-color:var(--border2); color:var(--text); }
.mpill.active { background:var(--pill-active-bg); border-color:var(--pill-active-border); color:var(--pill-active-color); font-weight:700; box-shadow:0 0 8px rgba(61,111,255,.15); }
[data-theme="zioto"] .mpill.active { box-shadow:0 0 10px rgba(155,29,219,.2); }
.mpill:disabled { opacity:.22; cursor:not-allowed; }
.mactions { display:flex; gap:5px; margin-top:7px; }
.mact-btn { padding:4px 10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:var(--mono-font); font-size:9px; cursor:pointer; transition:all .15s; }
.mact-btn:hover { border-color:var(--border2); color:var(--text); }
.sel-info { font-family:var(--mono-font); font-size:9px; color:var(--muted); margin-top:5px; }

/* ── MAIN ── */
.main { padding:16px; max-width:920px; margin:0 auto; }

/* ── KPI ── */
.kgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
.kfull { grid-column:1/-1; }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; position:relative; overflow:hidden; transition:all .3s; }
.kpi::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; border-radius:14px 14px 0 0; }
.kpi.g { border-color:rgba(0,229,160,.15); } .kpi.g::after { background:var(--green); box-shadow:0 0 8px var(--green); }
.kpi.r { border-color:rgba(255,79,109,.15); } .kpi.r::after { background:var(--red); box-shadow:0 0 8px var(--red); }
.kpi.b { border-color:rgba(61,111,255,.15); } .kpi.b::after { background:var(--accent); box-shadow:0 0 8px var(--accent); }
[data-theme="clean"] .kpi::after { box-shadow:none; }
.klbl { font-family:var(--mono-font); font-size:9px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px; }
.kval { font-family:var(--heading-font); font-size:20px; font-weight:900; line-height:1; }
[data-theme="zioto"] .kval { font-size:24px; }
.kval.g { color:var(--green); text-shadow:var(--neon-green); }
.kval.r { color:var(--red); text-shadow:var(--neon-red); }
.kval.b { color:var(--accent); text-shadow:var(--neon-blue); }
[data-theme="clean"] .kval { text-shadow:none; }
.ksub { font-size:10px; color:var(--muted); margin-top:5px; }
.ktag { display:inline-flex; align-items:center; gap:3px; margin-top:6px; font-family:var(--mono-font); font-size:10px; padding:2px 8px; border-radius:99px; }
.ktag.up { background:rgba(0,229,160,.1); color:var(--green); border:1px solid rgba(0,229,160,.2); }
.ktag.dn { background:rgba(255,79,109,.1); color:var(--red); border:1px solid rgba(255,79,109,.2); }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.kpi { animation:fadeUp .3s ease both; }
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.08s}.kpi:nth-child(3){animation-delay:.12s}

/* ── SECTION TITLE ── */
.stitle { font-family:var(--heading-font); font-size:10px; color:var(--muted2); letter-spacing:.16em; text-transform:uppercase; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.stitle::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--border2),transparent); }
[data-theme="zioto"] .stitle { color:var(--yellow); text-shadow:var(--neon-yellow); font-size:11px; }
[data-theme="clean"] .stitle { color:var(--accent); letter-spacing:.1em; }

/* ── TOP 5 ── */
.top5 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
.t5card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; position:relative; overflow:hidden; }
.t5card::before { content:''; position:absolute; top:0; left:0; bottom:0; width:2px; background:var(--red); box-shadow:0 0 6px var(--red); }
[data-theme="clean"] .t5card::before { box-shadow:none; }
.t5rank { font-family:var(--heading-font); font-size:9px; color:var(--red); margin-bottom:4px; letter-spacing:.1em; }
.t5desc { font-size:11px; font-weight:500; line-height:1.3; padding-left:6px; word-break:break-word; }
.t5cat { font-family:var(--mono-font); font-size:9px; color:var(--muted2); margin-top:4px; padding-left:6px; }
.t5val { font-family:var(--heading-font); font-size:13px; font-weight:900; color:var(--red); margin-top:6px; padding-left:6px; text-shadow:var(--neon-red); }
[data-theme="clean"] .t5val { text-shadow:none; }
.t5card:nth-child(1) { grid-column:1/-1; }

/* ── VARIATION BLOCK ── */
.varblock { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
.vcard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; position:relative; overflow:hidden; }
.vcard.vup::before { content:''; position:absolute; top:0; left:0; bottom:0; width:2px; background:var(--red); }
.vcard.vdn::before { content:''; position:absolute; top:0; left:0; bottom:0; width:2px; background:var(--green); }
.vcat-name { font-size:11px; font-weight:500; padding-left:8px; margin-bottom:3px; }
.vcat-vals { display:flex; align-items:baseline; gap:6px; padding-left:8px; flex-wrap:wrap; }
.vcat-cur { font-family:var(--heading-font); font-size:12px; font-weight:900; }
.vcard.vup .vcat-cur { color:var(--red); text-shadow:var(--neon-red); }
.vcard.vdn .vcat-cur { color:var(--green); text-shadow:var(--neon-green); }
[data-theme="clean"] .vcat-cur { text-shadow:none; }
.vcat-prev { font-family:var(--mono-font); font-size:9px; color:var(--muted); }
.vcat-pct { font-family:var(--heading-font); font-size:10px; padding:1px 7px; border-radius:99px; margin-left:auto; }
.vcard.vup .vcat-pct { background:rgba(255,79,109,.12); color:var(--red); border:1px solid rgba(255,79,109,.25); }
.vcard.vdn .vcat-pct { background:rgba(0,229,160,.12); color:var(--green); border:1px solid rgba(0,229,160,.25); }
.vcard:nth-child(1) { grid-column:1/-1; }

/* ── CHART ── */
.chart-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:20px; }
.chart-title { font-size:11px; color:var(--muted2); margin-bottom:4px; }
.cbars { display:flex; align-items:flex-end; gap:3px; height:90px; margin-top:14px; }
.ccol { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; transition:opacity .2s; }
.ccol-bars { flex:1; width:100%; display:flex; align-items:flex-end; gap:1px; }
.bar-i,.bar-e { flex:1; border-radius:2px 2px 0 0; min-height:2px; transition:height .5s cubic-bezier(.22,1,.36,1); }
.bar-i { background:var(--green); opacity:.5; }
.bar-e { background:var(--red); opacity:.65; }
.ccol.sel .bar-e { opacity:1; box-shadow:0 0 5px rgba(255,79,109,.4); }
.ccol.sel .bar-i { opacity:1; box-shadow:0 0 5px rgba(0,229,160,.3); }
.ccol.dim { opacity:.22; }
[data-theme="clean"] .ccol.sel .bar-e,[data-theme="clean"] .ccol.sel .bar-i { box-shadow:none; }
.clbl { font-family:var(--mono-font); font-size:7px; color:var(--muted); }
.legend { display:flex; gap:14px; margin-top:10px; }
.leg { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
.ldot { width:7px; height:7px; border-radius:50%; }
.ldot.i { background:var(--green); } .ldot.e { background:var(--red); }

/* ── MULTI CHART ── */
.mchart-wrap { overflow-x:auto; margin-top:12px; padding-bottom:4px; }
.mchart { display:flex; align-items:flex-end; gap:14px; height:120px; min-width:max-content; padding:0 4px; }
.mccol { display:flex; flex-direction:column; align-items:center; gap:4px; }
.mccol-bars { display:flex; align-items:flex-end; gap:3px; height:100px; }
.mb-i,.mb-e { width:24px; border-radius:4px 4px 0 0; min-height:4px; transition:height .5s cubic-bezier(.22,1,.36,1); }
.mb-i { background:var(--green); opacity:.7; }
.mb-e { background:var(--red); opacity:.8; }
.mc-lbl { font-family:var(--mono-font); font-size:9px; color:var(--muted); text-align:center; }

/* ── BUDGET SECTION ── */
.budget-tabs { display:flex; gap:6px; margin-bottom:14px; }
.btab { padding:5px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:var(--mono-font); font-size:10px; cursor:pointer; transition:all .15s; }
.btab.active { background:var(--pill-active-bg); border-color:var(--pill-active-border); color:var(--pill-active-color); font-weight:700; }
.budget-table-wrap { overflow-x:auto; }
.btable { width:100%; border-collapse:collapse; font-size:11px; }
.btable th { font-family:var(--mono-font); font-size:9px; color:var(--muted); letter-spacing:.08em; text-align:right; padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
.btable th:first-child { text-align:left; }
.btable td { padding:8px 10px; border-bottom:1px solid rgba(255,255,255,.03); text-align:right; font-family:var(--mono-font); font-size:10px; }
[data-theme="clean"] .btable td { border-bottom-color:rgba(0,0,0,.05); }
.btable td:first-child { text-align:left; font-size:11px; font-family:var(--body-font); color:var(--text); }
.btable tr:last-child td { border-bottom:none; }
.btable .ok { color:var(--green); }
.btable .over { color:var(--red); font-weight:700; }
.bpill { display:inline-block; padding:1px 7px; border-radius:99px; font-size:9px; font-family:var(--mono-font); }
.bpill.ok { background:rgba(0,229,160,.1); color:var(--green); }
.bpill.over { background:rgba(255,79,109,.12); color:var(--red); }
.bpill.warn { background:rgba(255,183,0,.1); color:var(--yellow); }
.bbar-wrap { width:70px; height:4px; background:rgba(255,255,255,.06); border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
[data-theme="clean"] .bbar-wrap { background:rgba(0,0,0,.08); }
.bbar-fill { height:100%; border-radius:99px; transition:width .5s cubic-bezier(.22,1,.36,1); }
.budget-empty { font-size:12px; color:var(--muted); text-align:center; padding:32px; font-family:var(--mono-font); }

/* ── GROUPS ── */
.group-block { margin-bottom:16px; }
.group-hdr { display:flex; align-items:center; gap:8px; margin-bottom:8px; cursor:pointer; user-select:none; padding:8px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--border); transition:border-color .2s; }
.group-hdr:hover { border-color:var(--border2); }
.group-icon { font-size:14px; }
.group-name { font-family:var(--heading-font); font-size:9px; font-weight:700; color:var(--muted2); letter-spacing:.1em; }
.group-total { font-family:var(--heading-font); font-size:12px; margin-left:auto; font-weight:900; }
.group-pct { font-family:var(--mono-font); font-size:9px; color:var(--muted); margin-right:4px; }
.group-chevron { font-size:10px; color:var(--muted); transition:transform .2s; }
.group-block.closed .group-chevron { transform:rotate(-90deg); }
.group-cats { display:flex; flex-direction:column; gap:5px; padding-left:4px; }
.group-block.closed .group-cats { display:none; }

/* ── CATEGORY CARDS ── */
.ccard { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; transition:border-color .2s; animation:fadeUp .3s ease both; }
.ccard.open { border-color:var(--border2); }
.chdr { display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; user-select:none; -webkit-user-select:none; }
.chdr:active { background:rgba(255,255,255,.02); }
.cdot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.cinfo { flex:1; min-width:0; }
.cname { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ctrack { height:2px; background:rgba(255,255,255,.05); border-radius:99px; overflow:hidden; margin-top:5px; }
[data-theme="clean"] .ctrack { background:rgba(0,0,0,.07); }
.cfill { height:100%; border-radius:99px; transition:width .5s cubic-bezier(.22,1,.36,1); }
.cright { text-align:right; flex-shrink:0; }
.camount { font-family:var(--heading-font); font-size:12px; font-weight:900; }
.cmeta { display:flex; align-items:center; justify-content:flex-end; gap:5px; margin-top:3px; flex-wrap:wrap; }
.cpct { font-family:var(--mono-font); font-size:9px; color:var(--muted); }
.cdiff { font-family:var(--mono-font); font-size:9px; padding:1px 5px; border-radius:99px; }
.cdiff.up { background:rgba(255,79,109,.1); color:var(--red); border:1px solid rgba(255,79,109,.2); }
.cdiff.dn { background:rgba(0,229,160,.1); color:var(--green); border:1px solid rgba(0,229,160,.2); }
.cbudget-bar { height:2px; background:rgba(255,255,255,.04); border-radius:99px; margin-top:3px; overflow:hidden; }
.cbudget-fill { height:100%; border-radius:99px; transition:width .5s cubic-bezier(.22,1,.36,1); }
.chevron { font-size:9px; color:var(--muted); margin-left:6px; transition:transform .25s; flex-shrink:0; }
.ccard.open .chevron { transform:rotate(180deg); }
.citems { max-height:0; overflow:hidden; transition:max-height .4s cubic-bezier(.22,1,.36,1); border-top:0 solid var(--border); }
.ccard.open .citems { max-height:3000px; border-top:1px solid var(--border); }
.irow { display:flex; align-items:center; padding:8px 14px 8px 24px; border-bottom:1px solid rgba(255,255,255,.025); gap:8px; }
[data-theme="clean"] .irow { border-bottom-color:rgba(0,0,0,.04); }
.irow:last-child { border-bottom:none; }
.idate { font-family:var(--mono-font); font-size:9px; color:var(--muted); flex-shrink:0; width:50px; }
.idesc { font-size:11px; color:var(--muted2); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ival { font-family:var(--mono-font); font-size:10px; font-weight:700; flex-shrink:0; }
.ival.neg { color:var(--green); }

/* MULTI TABLE */
.mtable { width:100%; border-collapse:collapse; font-size:11px; margin-top:8px; }
.mtable th { font-family:var(--mono-font); font-size:9px; color:var(--muted); letter-spacing:.08em; text-align:right; padding:6px 8px; border-bottom:1px solid var(--border); }
.mtable th:first-child { text-align:left; }
.mtable td { padding:7px 8px; border-bottom:1px solid rgba(255,255,255,.025); text-align:right; font-family:var(--mono-font); font-size:10px; }
[data-theme="clean"] .mtable td { border-bottom-color:rgba(0,0,0,.05); }
.mtable td:first-child { text-align:left; font-size:11px; font-family:var(--body-font); color:var(--text); }
.mtable tr:last-child td { border-bottom:none; }
.mtable .best { color:var(--green); }
.mtable .worst { color:var(--red); }

/* LOADING/ERROR */
.sscreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; gap:14px; text-align:center; padding:32px; }
.sicon { font-size:34px; }
.stitle2 { font-family:var(--heading-font); font-size:12px; color:var(--accent); letter-spacing:.1em; text-shadow:var(--neon-blue); }
[data-theme="clean"] .stitle2 { text-shadow:none; }
.ssub { font-size:12px; color:var(--muted); max-width:300px; line-height:1.7; }
.spinner { width:26px; height:26px; border:2px solid var(--border2); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
.sync-ts { font-family:var(--mono-font); font-size:9px; color:var(--muted); margin-bottom:10px; text-align:right; }

@media(min-width:600px){
  .kgrid{grid-template-columns:repeat(3,1fr)} .kfull{grid-column:auto}
  .main{padding:22px} .kval{font-size:22px}
  .top5{grid-template-columns:repeat(3,1fr)} .t5card:nth-child(1){grid-column:auto}
  .varblock{grid-template-columns:repeat(3,1fr)} .vcard:nth-child(1){grid-column:auto}
}
@media(max-width:380px){
  .top5,.varblock{grid-template-columns:1fr}
  .t5card:nth-child(1),.vcard:nth-child(1){grid-column:auto}
}
</style>

<body>

<!-- ── LOGIN ── -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo" id="loginLogo">⬡ FIN · LUCAS</div>
    <div class="login-sub">Dashboard financeiro pessoal</div>
    <input class="login-input" type="password" id="pwdInput" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" onclick="checkPwd()">ENTRAR</button>
    <div class="login-err" id="loginErr">Senha incorreta. Tente novamente.</div>
  </div>
</div>

<!-- ── APP ── -->
<div id="appWrap" style="display:none">
  <div class="hdr">
    <span class="logo" id="logoText">⬡ FIN · LUCAS</span>
    <div class="hdr-right">
      <button class="hdr-btn" id="themeBtn" onclick="cycleTheme()" title="Trocar tema">◑ <span id="themeLbl">DARK</span></button>
      <select class="year-sel" id="yearSel" onchange="onYearChange()"><option value="2026">2026</option></select>
      <button class="hdr-btn sync-btn" id="syncBtn" onclick="loadYear()">
        <span id="sicon">↻</span><span id="slabel">Atualizar</span>
      </button>
    </div>
  </div>

  <div class="mwrap">
    <div class="mrow">
      <span class="mrow-label">Meses</span>
      <div class="m-pills" id="mpills"></div>
    </div>
    <div class="mactions">
      <button class="mact-btn" onclick="selAll()">Todos</button>
      <button class="mact-btn" onclick="selClear()">Limpar</button>
      <button class="mact-btn" onclick="selYTD()">Até hoje</button>
    </div>
    <div class="sel-info" id="selInfo"></div>
  </div>

  <div class="main" id="main">
    <div class="sscreen">
      <div class="spinner"></div>
      <div class="stitle2">Conectando ao Google Sheets...</div>
      <div class="ssub">Buscando dados financeiros em tempo real</div>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────────
const PWD_HASH = 'cd563b0426ff86cab5cba0d48a243c79d0329dc29657191f9dd1783a7f2c6f35';
const API_KEY  = 'AIzaSyCyQhel4bLhE0OI1JdHMZLYosGdJp-SpwE';
const YEAR_SHEETS = {
  '2026': '1mf06KxcDR2qcqQDRAUR92rG_uXvN_5qR4AoJv9Y520E',
};
const MONTHS = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

const TAG_MAP = {
  DSAL:'Impostos/Sal.',REM:'Reserva Emerg.',MERC:'Supermercado',
  REST:'Restaurante',MIS:'Miscelânea',PRE:'Presentes',
  TRANS:'Transporte',COMB:'Combustível',MAUT:'Manut. Auto',
  MOR:'Moradia',AFM:'Ajuda Mãe',SERV:'Serviços',
  BAR:'Bares',VEST:'Vestuário',EQUIP:'Equipamentos',
  LAZ:'Lazer',EDU:'Educação',RTRA:'Refeição Trab.',
  SAU:'Saúde',VIA:'Viagens',ZAB:'Amanda',
  GAM:'Games/Lucas',DEL:'Delivery',FIN:'Financiamentos',
};

const GROUPS = [
  {name:'Alimentação',icon:'🍽️',cats:['Supermercado','Restaurante','Refeição Trab.','Delivery','Bares'],clr:'#00e5a0'},
  {name:'Moradia',icon:'🏠',cats:['Moradia','Equipamentos'],clr:'#3d6fff'},
  {name:'Transporte',icon:'🚗',cats:['Combustível','Transporte','Manut. Auto'],clr:'#ffb700'},
  {name:'Lazer',icon:'🎮',cats:['Games/Lucas','Lazer','Viagens','Amanda','Miscelânea'],clr:'#a855f7'},
  {name:'Fixos',icon:'📌',cats:['Impostos/Sal.','Financiamentos','Serviços','Reserva Emerg.','Ajuda Mãe'],clr:'#ff4f6d'},
  {name:'Outros',icon:'📦',cats:['Vestuário','Educação','Saúde','Presentes'],clr:'#ff7b2e'},
];

const CAT_CLR = {
  'Supermercado':'#00e5a0','Restaurante':'#00e5a0','Refeição Trab.':'#00e5a0','Delivery':'#00e5a0','Bares':'#00e5a0',
  'Moradia':'#3d6fff','Equipamentos':'#60a5fa',
  'Combustível':'#ffb700','Transporte':'#ffb700','Manut. Auto':'#ffb700',
  'Games/Lucas':'#a855f7','Lazer':'#a855f7','Viagens':'#a855f7','Amanda':'#c084fc','Miscelânea':'#a855f7',
  'Impostos/Sal.':'#ff4f6d','Financiamentos':'#ff4f6d','Serviços':'#ff4f6d','Reserva Emerg.':'#ff4f6d','Ajuda Mãe':'#ff4f6d',
  'Vestuário':'#ff7b2e','Educação':'#ff7b2e','Saúde':'#ff7b2e','Presentes':'#ff7b2e',
};

const THEMES = ['dark','clean','zioto'];
const THEME_LABELS = {dark:'DARK',clean:'CLEAN',zioto:'ZIOTO'};
const LOGO_TEXTS = {
  dark:'⬡ FIN · LUCAS',
  clean:'Finanças · Lucas',
  zioto:'Controle Financeiro, by Zioto Labs'
};

// ─── STATE ─────────────────────────────────────────────────────────────────────
let allData={}, budgetData={}, selectedMos=[], activeYear='2026', lastSync=null, groupOpen={};
let themeIdx=0, activeBudgetTab='filtered';

// ─── AUTH ──────────────────────────────────────────────────────────────────────
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkPwd(){
  const val=document.getElementById('pwdInput').value;
  const h=await sha256(val);
  if(h===PWD_HASH){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('appWrap').style.display='block';
    sessionStorage.setItem('auth','1');
    loadYear();
  } else {
    document.getElementById('loginErr').style.display='block';
    document.getElementById('pwdInput').value='';
    document.getElementById('pwdInput').focus();
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  if(sessionStorage.getItem('auth')==='1'){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('appWrap').style.display='block';
    loadYear();
  }
  document.getElementById('pwdInput').addEventListener('keydown',e=>{ if(e.key==='Enter') checkPwd(); });
});

// ─── THEME ─────────────────────────────────────────────────────────────────────
function cycleTheme(){
  themeIdx=(themeIdx+1)%THEMES.length;
  applyTheme();
}
function applyTheme(){
  const t=THEMES[themeIdx];
  document.documentElement.setAttribute('data-theme', t==='dark'?'':t);
  document.getElementById('themeLbl').textContent=THEME_LABELS[t];
  document.getElementById('logoText').textContent=LOGO_TEXTS[t];
  document.getElementById('loginLogo').textContent=LOGO_TEXTS[t];
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc) mc.content=t==='clean'?'#f4f5f7':t==='zioto'?'#9B1DDB':'#06080f';
}

// ─── HELPERS ───────────────────────────────────────────────────────────────────
const parseBRL=s=>{
  if(!s) return 0;
  const c=String(s).replace(/R\$\s?/g,'').replace(/\s/g,'').replace(/\./g,'').replace(',','.').trim();
  const n=parseFloat(c); return isNaN(n)?0:n;
};
const fmtK=n=>{
  const a=Math.abs(n),sg=n<0?'-':'';
  if(a>=1000) return sg+'R$'+(a/1000).toFixed(1).replace('.',',')+'k';
  return (n<0?'-':'')+'R$'+a.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const fmtFull=n=>{
  const a=Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (n<0?'-R$ ':'R$ ')+a;
};
const getPrev=m=>{const i=MONTHS.indexOf(m);return i>0?MONTHS[i-1]:null;};

// ─── API ───────────────────────────────────────────────────────────────────────
async function apiGet(id,path){
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}${path}&key=${API_KEY}`);
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||`Erro ${r.status}`);}
  return r.json();
}
const getNames=async id=>(await apiGet(id,'?fields=sheets.properties.title')).sheets.map(s=>s.properties.title);
const getRows=async(id,tab)=>(await apiGet(id,`/values/${encodeURIComponent(tab+'!A1:Z2000')}?`)).values||[];

// ─── PARSERS ───────────────────────────────────────────────────────────────────
function parseSheet(rows){
  let receita=0,despesaTotal=0;
  const cats={},items={};
  Object.values(TAG_MAP).forEach(n=>{cats[n]=0;items[n]=[];});
  for(const row of rows){
    const c=row.map(x=>String(x||'').trim());
    const up=c.join('|').toUpperCase();
    if(up.includes('TOTAL GASTO')){
      for(let j=0;j<c.length;j++) if(c[j].toUpperCase().includes('TOTAL GASTO')){const v=parseBRL(c[j+1]||c[j+2]||'');if(v>despesaTotal)despesaTotal=v;}
    }
    if(up.includes('TOTAL RECEBER')){
      for(let j=0;j<c.length;j++) if(c[j].toUpperCase().includes('TOTAL RECEBER')){const v=parseBRL(c[j+1]||c[j+2]||'');if(v>receita)receita=v;}
    }
    let date='',tag='',desc='',valStr='';
    if(c.length>=4&&TAG_MAP[c[1]]&&!TAG_MAP[c[0]]){date=c[0];tag=c[1];desc=c[2];valStr=c[3];}
    else if(c.length>=4&&c[0]===''&&TAG_MAP[c[1]]){tag=c[1];desc=c[2];valStr=c[3];}
    else if(c.length>=3&&TAG_MAP[c[0]]&&!c[0].includes(' ')){tag=c[0];desc=c[1];valStr=c[2];}
    if(tag&&TAG_MAP[tag]){
      const cat=TAG_MAP[tag],val=parseBRL(valStr);
      if(val!==0&&cats[cat]!==undefined){cats[cat]+=val;items[cat].push({date:date||'—',desc:desc||'—',val});}
    }
  }
  Object.keys(cats).forEach(k=>{if(cats[k]<0)cats[k]=0;});
  return{receita,despesaTotal,cats,items};
}

// Budget parser — format: "jan./26 | TAG | Descrição | Valor"
function parseBudgetSheet(rows){
  // b = { 'JAN': { catName: valor }, ... }
  const b={};
  MONTHS.forEach(m=>b[m]={});
  for(const row of rows){
    const c=row.map(x=>String(x||'').trim());
    if(c.length<4) continue;
    // Parse competência: "jan./26", "fev./26", etc
    const compRaw=c[0].toLowerCase().trim();
    const moMap={'jan':0,'fev':1,'mar':2,'abr':3,'mai':4,'jun':5,'jul':6,'ago':7,'set':8,'out':9,'nov':10,'dez':11};
    const moKey=Object.keys(moMap).find(k=>compRaw.startsWith(k));
    if(!moKey) continue;
    const mIdx=moMap[moKey];
    const mName=MONTHS[mIdx];
    const tag=c[1].toUpperCase().trim();
    if(!TAG_MAP[tag]) continue;
    const catName=TAG_MAP[tag];
    const val=parseBRL(c[3]);
    if(val>0) b[mName][catName]=(b[mName][catName]||0)+val;
  }
  return b;
}

function getBudgetFor(months){
  const agg={};
  for(const m of months){const mb=budgetData[m]||{};Object.keys(mb).forEach(cat=>{agg[cat]=(agg[cat]||0)+mb[cat];});}
  return agg;
}

// ─── LOAD ──────────────────────────────────────────────────────────────────────
async function loadYear(){
  setSyncState('loading');
  const id=YEAR_SHEETS[activeYear];
  if(!id){showErr('Planilha de '+activeYear+' não configurada.');setSyncState('err');return;}
  try{
    const names=await getNames(id);
    allData={}; budgetData={};
    for(const name of names){
      const key=MONTHS.find(m=>name.toUpperCase()===m||name.toUpperCase().startsWith(m+' ')||name.toUpperCase().startsWith(m+'/'));
      if(key) allData[key]=parseSheet(await getRows(id,name));
      if(/previs|or[çc]amento|budget|planejamento/i.test(name)){
        budgetData=parseBudgetSheet(await getRows(id,name));
      }
    }
    const avail=MONTHS.filter(m=>allData[m]);
    if(!avail.length) throw new Error('Nenhuma aba de mês encontrada (JAN, FEV…)');
    if(selectedMos.length===0||!selectedMos.some(m=>allData[m])) selectedMos=[avail[avail.length-1]];
    GROUPS.forEach(g=>{if(groupOpen[g.name]===undefined)groupOpen[g.name]=true;});
    lastSync=new Date();
    setSyncState('ok');
    buildYearSel(); buildPills(); render();
  }catch(e){console.error(e);setSyncState('err');showErr(e.message);}
}

// ─── YEAR ──────────────────────────────────────────────────────────────────────
function buildYearSel(){
  const sel=document.getElementById('yearSel'); sel.innerHTML='';
  Object.keys(YEAR_SHEETS).sort((a,b)=>b-a).forEach(y=>{
    const o=document.createElement('option'); o.value=y; o.textContent=y;
    if(y===activeYear)o.selected=true; sel.appendChild(o);
  });
}
function onYearChange(){activeYear=document.getElementById('yearSel').value;selectedMos=[];allData={};budgetData={};loadYear();}

// ─── SYNC ──────────────────────────────────────────────────────────────────────
function setSyncState(s){
  const btn=document.getElementById('syncBtn'),ic=document.getElementById('sicon'),lb=document.getElementById('slabel');
  btn.className='hdr-btn sync-btn '+s;
  if(s==='loading'){ic.className='spin';ic.textContent='↻';lb.textContent='Buscando...'}
  if(s==='ok'){ic.className='';ic.textContent='✓';lb.textContent='Atualizado';setTimeout(()=>setSyncState('idle'),2500)}
  if(s==='idle'){ic.className='';ic.textContent='↻';lb.textContent='Atualizar';btn.className='hdr-btn sync-btn'}
  if(s==='err'){ic.className='';ic.textContent='✕';lb.textContent='Erro'}
}
function showErr(msg){document.getElementById('main').innerHTML=`<div class="sscreen"><div class="sicon">⚠</div><div class="stitle2">Não foi possível carregar</div><div class="ssub">${msg}</div></div>`;}

// ─── PILLS ─────────────────────────────────────────────────────────────────────
function buildPills(){
  const wrap=document.getElementById('mpills'); wrap.innerHTML='';
  MONTHS.forEach(m=>{
    const has=!!allData[m];
    const btn=document.createElement('button');
    btn.className='mpill'+(selectedMos.includes(m)?' active':'');
    btn.textContent=m; btn.disabled=!has;
    btn.onclick=()=>toggleMonth(m);
    wrap.appendChild(btn);
  });
  updateSelInfo();
}
function toggleMonth(m){
  if(!allData[m])return;
  if(selectedMos.includes(m)){if(selectedMos.length===1)return;selectedMos=selectedMos.filter(x=>x!==m);}
  else selectedMos=[...selectedMos,m].sort((a,b)=>MONTHS.indexOf(a)-MONTHS.indexOf(b));
  buildPills(); render();
}
function selAll(){selectedMos=MONTHS.filter(m=>allData[m]);buildPills();render();}
function selClear(){const av=MONTHS.filter(m=>allData[m]);selectedMos=[av[av.length-1]];buildPills();render();}
function selYTD(){
  const ci=new Date().getMonth();
  selectedMos=MONTHS.slice(0,ci+1).filter(m=>allData[m]);
  if(!selectedMos.length)selectedMos=MONTHS.filter(m=>allData[m]);
  buildPills();render();
}
function updateSelInfo(){
  const n=selectedMos.length,info=document.getElementById('selInfo');
  info.textContent=n===1?`Exibindo: ${selectedMos[0]} / ${activeYear}`:`${n} meses selecionados: ${selectedMos.join(', ')}`;
}
function quickSel(m){selectedMos=[m];buildPills();render();}

// ─── AGGREGATE ─────────────────────────────────────────────────────────────────
function aggregate(months){
  const cats={},items={};
  Object.values(TAG_MAP).forEach(n=>{cats[n]=0;items[n]=[];});
  let receita=0,despesaTotal=0;
  for(const m of months){
    const d=allData[m];if(!d)continue;
    receita+=d.receita;despesaTotal+=d.despesaTotal;
    Object.keys(cats).forEach(k=>{cats[k]+=(d.cats[k]||0);});
    Object.keys(items).forEach(k=>{items[k]=[...items[k],...(d.items[k]||[])];});
  }
  return{receita,despesaTotal,cats,items};
}

// ─── BUDGET TABLE ──────────────────────────────────────────────────────────────
function buildBudgetSection(filteredMonths){
  const hasBudget=Object.keys(budgetData).some(m=>Object.keys(budgetData[m]||{}).length>0);
  if(!hasBudget) return `<div class="budget-empty">Aba "Previsão Orçamentária" não encontrada na planilha.<br>Adicione a aba e clique em Atualizar.</div>`;

  // YTD months: jan até mês atual do sistema
  const nowIdx=new Date().getMonth();
  const ytdMonths=MONTHS.slice(0,nowIdx+1).filter(m=>allData[m]);

  const tabs=`<div class="budget-tabs">
    <button class="btab${activeBudgetTab==='filtered'?' active':''}" onclick="setBudgetTab('filtered')">Meses selecionados</button>
    <button class="btab${activeBudgetTab==='ytd'?' active':''}" onclick="setBudgetTab('ytd')">Acumulado YTD (até ${MONTHS[nowIdx]})</button>
  </div>`;

  const months=activeBudgetTab==='filtered'?filteredMonths:ytdMonths;
  const budAgg=getBudgetFor(months);
  const realAgg=aggregate(months);

  const rows=Object.keys(budAgg)
    .filter(cat=>budAgg[cat]>0)
    .sort((a,b)=>budAgg[b]-budAgg[a])
    .map(cat=>{
      const orc=budAgg[cat]||0, real=realAgg.cats[cat]||0;
      const diff=orc-real, pct=orc>0?(real/orc*100):0;
      const over=real>orc, warn=pct>=85&&pct<=100;
      const pillCls=over?'over':warn?'warn':'ok';
      const pillLbl=over?'Acima':'ok';
      const barClr=over?'var(--red)':warn?'var(--yellow)':'var(--green)';
      const barW=Math.min(pct,100).toFixed(1);
      return `<tr>
        <td>${cat}</td>
        <td>${fmtFull(orc)}</td>
        <td class="${over?'over':''}">${fmtFull(real)}</td>
        <td class="${over?'over':'ok'}">${over?'-':'+'}${fmtFull(Math.abs(diff))}</td>
        <td>
          <span class="bpill ${pillCls}">${pct.toFixed(0)}%</span>
          <span class="bbar-wrap"><span class="bbar-fill" style="width:${barW}%;background:${barClr}"></span></span>
        </td>
      </tr>`;
    }).join('');

  const totalOrc=Object.values(budAgg).reduce((s,v)=>s+v,0);
  const totalReal=realAgg.despesaTotal;
  const totalDiff=totalOrc-totalReal;
  const totalPct=totalOrc>0?(totalReal/totalOrc*100):0;

  return `${tabs}
    <div class="budget-table-wrap">
      <table class="btable">
        <thead><tr><th>Categoria</th><th>Orçado</th><th>Realizado</th><th>Diferença</th><th>% Uso</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr style="border-top:1px solid var(--border2)">
            <td style="font-weight:700;font-family:var(--heading-font);font-size:11px">TOTAL</td>
            <td style="font-weight:700">${fmtFull(totalOrc)}</td>
            <td style="font-weight:700;color:${totalReal>totalOrc?'var(--red)':'var(--green)'}">${fmtFull(totalReal)}</td>
            <td style="font-weight:700;color:${totalDiff>=0?'var(--green)':'var(--red)'}">${totalDiff>=0?'+':'-'}${fmtFull(Math.abs(totalDiff))}</td>
            <td><span class="bpill ${totalReal>totalOrc?'over':totalPct>=85?'warn':'ok'}">${totalPct.toFixed(0)}%</span></td>
          </tr>
        </tfoot>
      </table>
    </div>`;
}

function setBudgetTab(tab){activeBudgetTab=tab;render();}

// ─── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const isSingle=selectedMos.length===1;
  const agg=aggregate(selectedMos);
  const prevM=isSingle?getPrev(selectedMos[0]):null;
  const prevAgg=prevM&&allData[prevM]?allData[prevM]:null;
  const saldo=agg.receita-agg.despesaTotal;

  const mkBadge=(cur,prev,lbl,inv=false)=>{
    if(!prev||prev===0)return'';
    const diff=cur-prev,pct=((diff/prev)*100).toFixed(0);
    const better=inv?(diff<=0):(diff>=0);
    const cls=better?'up':'dn',arrow=diff>=0?'▲':'▼';
    return `<div class="ktag ${cls}">${arrow} ${fmtK(Math.abs(diff))} vs ${lbl}</div>`;
  };

  // KPIs
  const kpiHtml=`<div class="kgrid">
    <div class="kpi g">
      <div class="klbl">Receita Líquida</div>
      <div class="kval g">${fmtK(agg.receita)}</div>
      <div class="ksub">${isSingle?'após impostos':selectedMos.length+' meses acumulados'}</div>
      ${prevAgg?mkBadge(agg.receita,prevAgg.receita,prevM):''}
    </div>
    <div class="kpi r">
      <div class="klbl">Total Despesas</div>
      <div class="kval r">${fmtK(agg.despesaTotal)}</div>
      <div class="ksub">${Object.values(agg.cats).filter(v=>v>0).length} categorias ativas</div>
      ${prevAgg?mkBadge(agg.despesaTotal,prevAgg.despesaTotal,prevM,true):''}
    </div>
    <div class="kpi ${saldo>=0?'g':'r'} kfull">
      <div class="klbl">Saldo${isSingle?' · '+selectedMos[0]+'/'+activeYear:' · '+selectedMos.length+' meses'}</div>
      <div class="kval ${saldo>=0?'g':'r'}">${saldo>=0?'+':''}${fmtK(saldo)}</div>
      <div class="ksub">${saldo>=0?'✓ Dentro do orçamento':'⚠ Déficit — gastos acima da receita'}</div>
      ${prevAgg?mkBadge(saldo,prevAgg.receita-prevAgg.despesaTotal,prevM):''}
    </div>
  </div>`;

  // Top 5 (single only)
  let top5Html='';
  if(isSingle){
    const all=[];
    Object.entries(agg.items).forEach(([cat,its])=>its.forEach(it=>{if(it.val>0)all.push({...it,cat});}));
    const top=all.sort((a,b)=>b.val-a.val).slice(0,5);
    if(top.length) top5Html=`<div class="stitle">Top 5 Maiores Gastos</div>
      <div class="top5">${top.map((it,i)=>`<div class="t5card">
        <div class="t5rank">#${i+1}</div>
        <div class="t5desc">${it.desc}</div>
        <div class="t5cat">${it.cat} · ${it.date}</div>
        <div class="t5val">${fmtFull(it.val)}</div>
      </div>`).join('')}</div>`;
  }

  // Top 5 variações (single only)
  let varHtml='';
  if(isSingle&&prevAgg){
    const vars=Object.entries(agg.cats)
      .filter(([cat,val])=>val>0&&prevAgg.cats[cat]>0)
      .map(([cat,val])=>({cat,val,prev:prevAgg.cats[cat],pct:((val-prevAgg.cats[cat])/prevAgg.cats[cat])*100}))
      .sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct)).slice(0,5);
    if(vars.length) varHtml=`<div class="stitle">Top 5 Variações vs ${prevM}</div>
      <div class="varblock">${vars.map(v=>`<div class="vcard ${v.pct>0?'vup':'vdn'}">
        <div class="vcat-name">${v.cat}</div>
        <div class="vcat-vals">
          <span class="vcat-cur">${fmtK(v.val)}</span>
          <span class="vcat-prev">ant: ${fmtK(v.prev)}</span>
          <span class="vcat-pct">${v.pct>0?'▲':'▼'}${Math.abs(v.pct).toFixed(0)}%</span>
        </div>
      </div>`).join('')}</div>`;
  }

  // Trend — sempre 12 meses fixo
  const maxT=Math.max(...MONTHS.map(m=>allData[m]?Math.max(allData[m].despesaTotal,allData[m].receita):0),1);
  const trendCols=MONTHS.map(m=>{
    const d=allData[m];
    if(!d) return `<div class="ccol dim"><div class="ccol-bars"><div class="bar-i" style="height:2%"></div><div class="bar-e" style="height:2%"></div></div><div class="clbl">${m}</div></div>`;
    const eH=Math.max((d.despesaTotal/maxT*100),2).toFixed(1);
    const iH=Math.max((d.receita/maxT*100),2).toFixed(1);
    const sel=selectedMos.includes(m);
    return `<div class="ccol ${sel?'sel':'dim'}" onclick="quickSel('${m}')">
      <div class="ccol-bars"><div class="bar-i" style="height:${iH}%"></div><div class="bar-e" style="height:${eH}%"></div></div>
      <div class="clbl">${m}</div>
    </div>`;
  }).join('');

  const trendHtml=`<div class="stitle">Evolução ${activeYear}</div>
    <div class="chart-card">
      <div class="chart-title">Receita × Despesas — toque para selecionar mês</div>
      <div class="cbars">${trendCols}</div>
      <div class="legend"><div class="leg"><div class="ldot i"></div>Receita</div><div class="leg"><div class="ldot e"></div>Despesas</div></div>
    </div>`;

  // Multi-month
  let multiHtml='';
  if(!isSingle){
    const maxM=Math.max(...selectedMos.map(m=>Math.max(allData[m]?.despesaTotal||0,allData[m]?.receita||0)),1);
    const mcols=selectedMos.map(m=>{
      const d=allData[m]||{receita:0,despesaTotal:0};
      const eH=Math.max((d.despesaTotal/maxM*90),2).toFixed(1);
      const iH=Math.max((d.receita/maxM*90),2).toFixed(1);
      return `<div class="mccol"><div class="mccol-bars"><div class="mb-i" style="height:${iH}px"></div><div class="mb-e" style="height:${eH}px"></div></div><div class="mc-lbl">${m}<br>${fmtK(d.despesaTotal)}</div></div>`;
    }).join('');
    const catRows=Object.keys(agg.cats).filter(k=>selectedMos.some(m=>allData[m]?.cats[k]>0))
      .sort((a,b)=>selectedMos.reduce((s,m)=>s+(allData[m]?.cats[b]||0),0)-selectedMos.reduce((s,m)=>s+(allData[m]?.cats[a]||0),0));
    const thCols=selectedMos.map(m=>`<th>${m}</th>`).join('');
    const tBodyRows=catRows.map(cat=>{
      const vals=selectedMos.map(m=>allData[m]?.cats[cat]||0);
      const pos=vals.filter(v=>v>0); const min=pos.length?Math.min(...pos):0; const max=Math.max(...vals);
      return `<tr><td>${cat}</td>${vals.map(v=>`<td class="${v===max&&max>0?' worst':v===min&&min>0&&pos.length>1?' best':''}">${v>0?fmtFull(v):'—'}</td>`).join('')}</tr>`;
    }).join('');
    multiHtml=`<div class="stitle">Comparativo de Meses</div>
      <div class="chart-card">
        <div class="chart-title">Receita × Despesas por mês selecionado</div>
        <div class="mchart-wrap"><div class="mchart">${mcols}</div></div>
        <div class="legend"><div class="leg"><div class="ldot i"></div>Receita</div><div class="leg"><div class="ldot e"></div>Despesas</div></div>
      </div>
      <div class="stitle">Categorias por Mês</div>
      <div class="chart-card" style="overflow-x:auto;padding:12px">
        <table class="mtable"><thead><tr><th>Categoria</th>${thCols}</tr></thead><tbody>${tBodyRows}</tbody></table>
        <div style="margin-top:8px;font-size:9px;font-family:var(--mono-font);color:var(--muted)">🟢 menor · 🔴 maior entre meses selecionados</div>
      </div>`;
  }

  // Budget
  const budgetHtml=`<div class="stitle">Orçamento</div>
    <div class="chart-card">${buildBudgetSection(selectedMos)}</div>`;

  // Groups
  const groupsHtml=buildGroups(agg,prevAgg,isSingle);
  const ts=lastSync?`Última atualização: ${lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`:'';

  document.getElementById('main').innerHTML=`
    ${kpiHtml}${top5Html}${varHtml}${trendHtml}${multiHtml}${budgetHtml}
    <div class="stitle">Despesas por Categoria</div>
    <div class="sync-ts">${ts}</div>
    ${groupsHtml}`;
  updateSelInfo();
}

// ─── GROUPS ────────────────────────────────────────────────────────────────────
function buildGroups(agg,prevAgg,isSingle){
  return GROUPS.map(g=>{
    const gTotal=g.cats.reduce((s,c)=>s+(agg.cats[c]||0),0);
    if(gTotal===0)return'';
    const gPct=agg.despesaTotal>0?(gTotal/agg.despesaTotal*100).toFixed(1):'0';
    const isOpen=groupOpen[g.name]!==false;
    const cats=g.cats.filter(c=>agg.cats[c]>0).sort((a,b)=>(agg.cats[b]||0)-(agg.cats[a]||0));
    const budAgg=getBudgetFor(selectedMos);

    const catsHtml=cats.map((catName,ci)=>{
      const val=agg.cats[catName]||0;
      const pct=agg.despesaTotal>0?(val/agg.despesaTotal*100).toFixed(1):'0';
      const maxG=Math.max(...g.cats.map(c=>agg.cats[c]||0),1);
      const barPct=(val/maxG*100).toFixed(1);
      const clr=CAT_CLR[catName]||'#8891a4';
      const cid=`cc_${g.name.replace(/\W/g,'_')}_${ci}`;
      let diffHtml='';
      if(isSingle&&prevAgg&&prevAgg.cats[catName]>0){
        const prev=prevAgg.cats[catName],d=((val-prev)/prev*100).toFixed(0);
        const cls=Number(d)>0?'up':'dn',arrow=Number(d)>0?'▲':'▼';
        diffHtml=`<span class="cdiff ${cls}">${arrow}${Math.abs(d)}%</span>`;
      }
      let budHtml='',budBar='';
      if(budAgg[catName]){
        const bval=budAgg[catName],bpct=Math.min(val/bval*100,100).toFixed(1);
        const over=val>bval,bpctD=(val/bval*100).toFixed(0);
        budHtml=`<span style="font-family:var(--mono-font);font-size:9px;color:var(--muted)">${over?'⚠ ':''} ${bpctD}% orç</span>`;
        budBar=`<div class="cbudget-bar"><div class="cbudget-fill" style="width:${bpct}%;background:${over?'var(--red)':clr}"></div></div>`;
      }
      const its=(agg.items[catName]||[]).slice().sort((a,b)=>Math.abs(b.val)-Math.abs(a.val));
      const itsHtml=its.length
        ?its.map(it=>`<div class="irow"><span class="idate">${it.date}</span><span class="idesc" title="${it.desc}">${it.desc}</span><span class="ival${it.val<0?' neg':''}">${fmtFull(it.val)}</span></div>`).join('')
        :'<div class="irow"><span class="idesc" style="color:var(--muted)">Sem itens neste período</span></div>';
      return `<div class="ccard" id="${cid}">
        <div class="chdr" onclick="toggleCat('${cid}')">
          <div class="cdot" style="background:${clr};box-shadow:0 0 4px ${clr}88"></div>
          <div class="cinfo">
            <div class="cname">${catName}</div>
            <div class="ctrack"><div class="cfill" style="width:${barPct}%;background:${clr}"></div></div>
            ${budBar}
          </div>
          <div class="cright">
            <div class="camount" style="color:${clr};text-shadow:0 0 6px ${clr}55">${fmtFull(val)}</div>
            <div class="cmeta"><span class="cpct">${pct}%</span>${diffHtml}${budHtml}</div>
          </div>
          <span class="chevron">▾</span>
        </div>
        <div class="citems">${itsHtml}</div>
      </div>`;
    }).join('');

    return `<div class="group-block${isOpen?'':' closed'}" id="grp_${g.name.replace(/\W/g,'_')}">
      <div class="group-hdr" onclick="toggleGroup('${g.name}')">
        <span class="group-icon">${g.icon}</span>
        <span class="group-name">${g.name}</span>
        <span class="group-pct">${gPct}%</span>
        <span class="group-total" style="color:${g.clr};text-shadow:0 0 8px ${g.clr}55">${fmtFull(gTotal)}</span>
        <span class="group-chevron">▾</span>
      </div>
      <div class="group-cats">${catsHtml}</div>
    </div>`;
  }).join('');
}

function toggleCat(id){document.getElementById(id)?.classList.toggle('open');}
function toggleGroup(name){
  groupOpen[name]=!groupOpen[name];
  document.getElementById('grp_'+name.replace(/\W/g,'_'))?.classList.toggle('closed',!groupOpen[name]);
}
</script>
</body>
</html>
